name: Copy photos from WordPress into this repo
on:
  workflow_dispatch:
  push:
    paths: [".github/images.txt", ".github/workflows/fetch-photos.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download photos
        run: |
          set +e
          exec > >(tee .github/photo-report.txt) 2>&1
          IP=$(dig +short old.youthfacebeauty.com A | tail -1)
          echo "old.youthfacebeauty.com -> ${IP:-no A record}"
          echo "youthfacebeauty.com -> $(dig +short youthfacebeauty.com A | tr '\n' ' ')"
          echo "old home: $(curl -skI --max-time 20 https://old.youthfacebeauty.com/ | head -1)"
          echo "old test image: $(curl -skI --max-time 20 https://old.youthfacebeauty.com/wp-content/uploads/2026/09/Youth-Face-Beauty-Cream-25g.png | head -1)"
          ok=0; fail=0
          while read -r p; do
            [ -z "$p" ] && continue
            out="wp-content/uploads/$p"; mkdir -p "$(dirname "$out")"
            got=""
            for url in "https://old.youthfacebeauty.com/wp-content/uploads/$p" "http://old.youthfacebeauty.com/wp-content/uploads/$p"; do
              curl -fsSLk --max-time 60 -A "Mozilla/5.0" -o "$out" "$url" && file --mime-type -b "$out" | grep -q '^image/' && got="$url" && break
            done
            if [ -z "$got" ] && [ -n "$IP" ]; then
              curl -fsSLk --max-time 60 -A "Mozilla/5.0" --resolve "youthfacebeauty.com:443:$IP" -o "$out" "https://youthfacebeauty.com/wp-content/uploads/$p" \
                && file --mime-type -b "$out" | grep -q '^image/' && got="origin-ip"
            fi
            if [ -z "$got" ]; then
              for ts in 2026 2025; do
                curl -fsSL --max-time 60 -o "$out" "https://web.archive.org/web/${ts}id_/https://youthfacebeauty.com/wp-content/uploads/$p" \
                  && file --mime-type -b "$out" | grep -q '^image/' && got="archive" && break
              done
            fi
            if [ -n "$got" ]; then echo "OK   $p ($got)"; ok=$((ok+1)); else echo "FAIL $p"; rm -f "$out"; fail=$((fail+1)); fi
          done < .github/images.txt
          echo "Downloaded $ok, failed $fail"
          echo "OK=$ok" >> $GITHUB_ENV
          sleep 1
      - name: Commit photos
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/photo-report.txt
          [ -d wp-content ] && git add wp-content
          git diff --cached --quiet || git commit -m "Add product and blog photos from WordPress [skip ci]"
          git push
